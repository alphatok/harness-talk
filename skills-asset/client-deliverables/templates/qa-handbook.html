<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{客户名称}} · 提案问答准备</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,sans-serif;--bg:#f6f7f4;--ink:#172a23;--card:#fff;--line:#d5dfd8;--acc:#246342}body.dark{--bg:#132019;--ink:#e6eee8;--card:#1b2d22;--line:#4a6552;--acc:#a8d5b3}header,main,footer{max-width:1000px;margin:auto;padding:28px}nav{display:flex;flex-wrap:wrap;gap:12px}a{color:var(--acc)}section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin:24px 0;scroll-margin-top:20px}h1{font-size:36px;line-height:1.3}h2{font-size:24px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}.note{padding:14px;border-left:4px solid var(--acc)}@media(max-width:600px){header,main,footer{padding:16px}section{padding:16px}h1{font-size:28px}table{font-size:14px}}@media print{@page{size:A4;margin:12mm}body,body.dark{--bg:#fff;--ink:#172a23;--card:#fff;--line:#ccc;--acc:#246342}button,nav{display:none}section{break-inside:avoid;border-radius:0}header,main,footer{padding:0}}</style><body><header><button type="button" onclick="document.body.classList.toggle('dark')">切换主题</button><p>{{日期}} · {{材料用途及证据状态}}</p><h1>{{客户名称}} · 提案问答准备</h1><p>{{本次沟通目标}}</p><p class="note">{{核心结论，包含重要条件与待确认项}}</p><nav><a href="#s1">沟通目标</a><a href="#s2">客户问题</a><a href="#s3">建议答法</a><a href="#s4">需要补充的证据</a><a href="#s5">内部准备与对外边界</a></nav></header><main><section id="s1"><h2>沟通目标</h2><p>{{本次受众及需要澄清的问题}}</p></section><section id="s2"><h2>客户问题</h2><p>{{客户原话或已知疑问，标来源}}</p></section><section id="s3"><h2>建议答法</h2><p>{{事实、建议与未知分开；不承诺未经验证的能力}}</p></section><section id="s4"><h2>需要补充的证据</h2><p>{{需提供的案例、演示或测量记录}}</p></section><section id="s5"><h2>内部准备与对外边界</h2><p>{{不能外发的假设和仍需确认的事项}}</p></section></main><footer><p>{{来源与定位，资料截止日，未核实事项和使用范围}}</p></footer></body></html>
