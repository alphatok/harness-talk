<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{CLIENT_NAME}} · 客户画像</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e4e8ef;--blue:#155eef;--sky:#eef4ff;--green:#067647;--amber:#b54708;--red:#b42318;--paper:#fff;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1180px;margin:auto;padding:36px 24px 64px}header{background:linear-gradient(135deg,#11275a,#155eef);color:#fff;padding:32px;border-radius:20px;box-shadow:0 18px 45px #155eef24}h1{margin:0 0 8px;font-size:30px}.sub{opacity:.82;display:flex;gap:18px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px;margin-top:22px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px}.panel h2{font-size:18px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase}.value{font-size:16px;font-weight:650;white-space:pre-wrap;margin:8px 0 12px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.pill{border-radius:999px;padding:2px 8px;background:#f2f4f7}.pill.confirmed,.pill.current{color:var(--green);background:#ecfdf3}.pill.attention,.pill.probable{color:var(--amber);background:#fffaeb}.pill.stale,.pill.conflicted{color:var(--red);background:#fef3f2}details{margin-top:10px;color:var(--muted)}ul{padding-left:18px}li{margin:8px 0}li span{float:right;color:var(--muted)}.empty{color:var(--muted);padding:30px;text-align:center}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wrap{padding:18px 12px}header{padding:24px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.panel,.card,header{box-shadow:none;break-inside:avoid}.layout{display:block}.panel{margin-top:12px}}
</style>
</head>
<body><main class="wrap">
<header><h1>{{CLIENT_NAME}}</h1><div class="sub"><span>ID：{{CLIENT_ID}}</span><span>更新时间：{{UPDATED_AT}}</span><span>新鲜度：{{FRESHNESS}}</span></div></header>
<div class="layout"><section class="panel"><h2>当前画像</h2><div class="grid">{{CARDS}}</div></section><aside><section class="panel"><h2>商机</h2><ul>{{OPPORTUNITIES}}</ul></section><section class="panel" style="margin-top:20px"><h2>冲突与待核实</h2><ul>{{CONFLICTS}}</ul></section></aside></div>
</main></body></html>
